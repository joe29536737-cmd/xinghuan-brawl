  <style>
    :root { color-scheme: dark; --ink:#101827; --paper:#fff6e8; --red:#e8564a; --mint:#84d6bc; }
    html, body { margin:0; width:100%; height:100%; background:var(--ink); color:var(--paper); font-family:system-ui,"Noto Sans TC","Noto Sans SC",sans-serif; }
    #loading { box-sizing:border-box; min-height:100%; display:grid; place-content:center; justify-items:center; gap:14px; padding:24px; text-align:center; background:radial-gradient(ellipse at 50% 42%, #24334a 0%, var(--ink) 68%); }
    #canvas { position:fixed; inset:0; z-index:1; display:block; width:100vw; height:100vh; opacity:0; }
    #loading { position:relative; z-index:2; }
    body.game-ready #canvas { opacity:1; }
    body.game-ready #loading { display:none; }
    .mark { width:54px; height:54px; object-fit:cover; border:2px solid #fff6e8; border-radius:16px; box-shadow:0 0 28px #e8564a55; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:.04em; }
    p { margin:0; color:#b8c4d4; font-size:14px; }
    progress { width:min(340px,76vw); height:8px; appearance:none; border:0; border-radius:99px; overflow:hidden; background:#273449; }
    progress::-webkit-progress-bar { background:#273449; border-radius:99px; }
    progress::-webkit-progress-value { background:linear-gradient(90deg,var(--red),#ffc36b); border-radius:99px; }
    progress::-moz-progress-bar { background:linear-gradient(90deg,var(--red),#ffc36b); border-radius:99px; }
    #status { min-height:1.5em; max-width:360px; line-height:1.5; }
    #retry { display:none; border:1px solid #ffffff36; border-radius:999px; padding:10px 22px; background:#e8564a; color:white; font:inherit; cursor:pointer; }
    #retry:focus-visible { outline:3px solid var(--mint); outline-offset:3px; }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }

    <h1>寶可夢：星環大亂鬥</h1>
    <p>整備隊伍，準備出發。</p>
    <progress id="progress" max="1" value="0" aria-label="載入進度"></progress>
    <p id="status">正在載入遊戲…</p>
    <button id="retry" type="button">重新載入</button>
  </div>
  <canvas id="canvas" aria-label="寶可夢：星環大亂鬥遊戲畫面"></canvas>
  <script>
    const statusEl = document.getElementById('status');
    const progressEl = document.getElementById('progress');
    const retry = document.getElementById('retry');
    let started = false;
    function retryGame() { if (started) return; started = true; retry.disabled = true; retry.style.display = 'none'; statusEl.textContent = '重新載入遊戲…'; location.reload(); }
    retry.addEventListener('click', retryGame);
    function showBootError(error) {
      const message = String(error?.message || error?.reason?.message || error?.reason || error || '未知啟動錯誤').replace(/\s+/g, ' ').slice(0, 200);
      console.error('[星環大亂鬥] Godot 啟動失敗：', error);
      statusEl.textContent = `載入失敗：${message}｜${window.__xhDiag ? window.__xhDiag() : ''}`;
      retry.style.display = 'inline-flex';
    }
    window.addEventListener('error', (event) => showBootError(event.error || event.message));
    window.addEventListener('unhandledrejection', (event) => showBootError(event.reason));
  </script>
  <script>
  /* 大檔分片載入：index.wasm / index.pck 若有 parts.json 就從分片組回（逐片下載並顯示進度） */
  (function () {
    var origFetch = window.fetch.bind(window), manifest = null, done = 0, total = 0;
    function say(t) { var el = document.getElementById("status"); if (el) el.textContent = t; }
    window.__xhDiag = function () {
      return "瀏覽器：" + navigator.userAgent.slice(0, 120) + "｜解壓縮：" + (typeof DecompressionStream) + "｜WebGL2：" + (!!document.createElement("canvas").getContext("webgl2"));
    };
    window.fetch = function (input, init) {
      var url = typeof input === "string" ? input : (input && input.url) || "";
      var name = url.split("?")[0].split("/").pop();
      if (name !== "index.wasm" && name !== "index.pck") return origFetch(input, init);
      manifest = manifest || origFetch("parts.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
        .then(function (m) { if (m) { total = 0; Object.keys(m).forEach(function (k) { total += m[k].files.length; }); } return m; });
      return manifest.then(function (m) {
        var e = m && m[name];
        if (!e) return origFetch(input, init);
        if (e.gz && typeof DecompressionStream === "undefined") {
          throw new Error("瀏覽器版本太舊，無法解壓遊戲檔（iPhone 需 iOS 16.4 以上，或改用最新版 Chrome / Safari）");
        }
        var bufs = [];
        var chain = Promise.resolve();
        e.files.forEach(function (f, i) {
          chain = chain.then(function () {
            return origFetch(f).then(function (r) {
              if (!r.ok) throw new Error("無法下載 " + f + "（" + r.status + "）");
              return r.arrayBuffer();
            }).then(function (b) { bufs[i] = b; done++; say("正在下載遊戲檔 " + done + " / " + total); });
          });
        });
        return chain.then(function () {
          say("正在解壓遊戲檔…");
          var blob = new Blob(bufs);
          var body = e.gz ? blob.stream().pipeThrough(new DecompressionStream("gzip")) : blob.stream();
          var headers = { "Content-Type": e.type };
          if (e.size) headers["Content-Length"] = String(e.size);
          return new Response(body, { status: 200, headers: headers });
        });
      });
    };
    setTimeout(function () {
      if (document.body.classList.contains("game-ready")) return;
      var el = document.getElementById("status");
      if (el) el.textContent = (el.textContent || "") + "（載入較久，若一直沒動請按重新載入）｜" + window.__xhDiag();
      var r = document.getElementById("retry"); if (r) r.style.display = "inline-flex";
    }, 90000);
  })();
  </script>
  <script>
  /* ===== 星環大亂鬥 雲端存檔橋接 (Firebase) ===== */
  (function () {
    var CFG = {
      apiKey: "AIzaSyC5aWS6jHwqZ__2oUyBh6r98rKR59A6dg0",
      authDomain: "xinghuan-game.firebaseapp.com",
      projectId: "xinghuan-game",
      storageBucket: "xinghuan-game.firebasestorage.app",
      messagingSenderId: "172760841096",
      appId: "1:172760841096:web:0e31b9666a4771cdc2583d"
    };
    var SDK = "https://www.gstatic.com/firebasejs/10.14.1/";
    var FLUSH_DELAY = 20000, MAX_BYTES = 900000;
    var listener = null, backlog = [], auth = null, db = null, user = null;
    var pending = null, timer = null, writing = false;
    function emit(type, payload) {
      var evt = JSON.stringify(Object.assign({ type: type }, payload || {}));
      if (listener) { try { listener(evt); } catch (e) { console.error(e); } } else { backlog.push(evt); }
    }
    function err(where, e) {
      var msg = (e && (e.code || e.message)) || String(e);
      console.warn("[XHCloud]", where, e);
      emit("error", { where: where, message: msg });
    }
    function load(src) {
      return new Promise(function (ok, bad) {
        var el = document.createElement("script"); el.src = src; el.async = true;
        el.onload = ok; el.onerror = function () { bad(new Error("無法載入 " + src)); };
        document.head.appendChild(el);
      });
    }
    function userInfo(u) { return u ? { uid: u.uid, name: u.displayName || "訓練家" } : null; }
    var ready = load(SDK + "firebase-app-compat.js")
      .then(function () { return Promise.all([load(SDK + "firebase-auth-compat.js"), load(SDK + "firebase-firestore-compat.js")]); })
      .then(function () {
        firebase.initializeApp(CFG);
        auth = firebase.auth(); db = firebase.firestore();
        auth.getRedirectResult().catch(function (e) { err("redirect", e); });
        auth.onAuthStateChanged(function (u) { user = u; emit("auth", { user: userInfo(u) }); });
        emit("ready", {});
      })
      .catch(function (e) { err("init", e); emit("unavailable", { message: String(e && e.message || e) }); });

    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!pending || !user || !db || writing) return Promise.resolve();
      var job = pending; pending = null; writing = true;
      return db.collection("saves").doc(user.uid).set({
        data: job.json, updatedAt: job.updatedAt, bytes: job.json.length, client: "web", v: 1
      }).then(function () { emit("saved", { updatedAt: job.updatedAt }); })
        .catch(function (e) { if (!pending) pending = job; err("save", e); })
        .then(function () { writing = false; if (pending) schedule(); });
    }
    function schedule() { if (!timer) timer = setTimeout(flush, FLUSH_DELAY); }
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flush(); });
    window.addEventListener("pagehide", function () { flush(); });

    window.XHCloud = {
      setListener: function (cb) { listener = cb; var b = backlog; backlog = []; b.forEach(function (e) { try { cb(e); } catch (x) {} }); return true; },
      currentUser: function () { return JSON.stringify(userInfo(user)); },
      signIn: function () {
        ready.then(function () {
          if (!auth) return;
          var provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          auth.signInWithPopup(provider).catch(function (e) {
            if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
              return auth.signInWithRedirect(provider);
            }
            if (e && e.code === "auth/popup-closed-by-user") { emit("cancelled", {}); return; }
            err("signIn", e);
          });
        });
        return true;
      },
      signOut: function () { flush().then(function () { if (auth) return auth.signOut(); }).catch(function (e) { err("signOut", e); }); return true; },
      fetchRemote: function () {
        ready.then(function () {
          if (!user || !db) return;
          db.collection("saves").doc(user.uid).get().then(function (snap) {
            if (!snap.exists) { emit("remote", { exists: false }); return; }
            var d = snap.data();
            emit("remote", { exists: true, updatedAt: d.updatedAt || 0, data: d.data || "" });
          }).catch(function (e) { err("fetch", e); });
        });
        return true;
      },
      queueSave: function (json, updatedAt, immediate) {
        json = String(json);
        if (json.length > MAX_BYTES) { emit("error", { where: "save", message: "存檔太大，無法上傳雲端" }); return false; }
        pending = { json: json, updatedAt: Number(updatedAt) || Date.now() };
        if (immediate) flush(); else schedule();
        return true;
      },
      flushNow: function () { flush(); return true; },
      exportFile: function (json, filename) {
        var blob = new Blob([String(json)], { type: "application/json" });
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
        a.download = filename || "xinghuan_save.json"; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        return true;
      },
      importFile: function () {
        var input = document.createElement("input"); input.type = "file"; input.accept = ".json,application/json";
        input.onchange = function () {
          var f = input.files && input.files[0]; if (!f) return;
          if (f.size > 4 * 1024 * 1024) { emit("error", { where: "import", message: "檔案太大" }); return; }
          f.text().then(function (t) { emit("import", { data: t, name: f.name }); }).catch(function (e) { err("import", e); });
        };
        input.click();
        return true;
      }
    };
